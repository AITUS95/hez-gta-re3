name: re3 Windows amd64

on:
  push:
    branches: [police]
  pull_request:
    branches: [police]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
      # D3D9 uses the Windows SDK. Audio import libraries and DLLs are vendored.
      # No Conan, Miles SDK or GLFW download is necessary for this target.
      - name: Configure
        shell: pwsh
        run: |
          ./premake5.exe vs2019 --with-librw --no-full-paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and link
        shell: pwsh
        run: |
          msbuild build/re3.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=win-amd64-librw_d3d9-oal /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item bin/win-amd64-librw_d3d9-oal/${{ matrix.configuration }}/re3.exe gamefiles/
          Copy-Item bin/win-amd64-librw_d3d9-oal/${{ matrix.configuration }}/re3.pdb gamefiles/
          Copy-Item vendor/mpg123/dist/Win64/libmpg123-0.dll gamefiles/
          Copy-Item vendor/openal-soft/dist/Win64/OpenAL32.dll gamefiles/
      - uses: actions/upload-artifact@v4
        with:
          name: re3-police-Windows-amd64-${{ matrix.configuration }}
          path: gamefiles/
          if-no-files-found: error
