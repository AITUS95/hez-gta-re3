name: Fix Colombian rival vehicle targeting

on:
  push:
    branches: [colombian]
    paths: [".github/workflows/fix-colombian-rival-vehicle.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix allied and rival gang vehicles
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/peds/PlayerPed.cpp')
          s = p.read_text()
          old = '''\tcase MI_DIABLOS:
          \tcase MI_COLUMB:
          \tcase MI_HOODS:'''.replace('          ', '')
          new = '''\tcase MI_DIABLOS:
          \tcase MI_MAFIA:
          \tcase MI_HOODS:'''.replace('          ', '')
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one rival vehicle block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git rm -f .github/workflows/fix-colombian-rival-vehicle.yml
          git add src/peds/PlayerPed.cpp
          ! sed -n '35,70p' src/peds/PlayerPed.cpp | grep -q 'MI_COLUMB'
          sed -n '35,70p' src/peds/PlayerPed.cpp | grep -q 'MI_MAFIA'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Treat Mafia vehicle as rival instead of Cartel Cruiser"
          git push origin HEAD:colombian
